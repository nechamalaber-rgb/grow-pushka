name: Pushka Reminder Check

on:
  schedule:
    # Runs every 30 minutes, all day, every day. GitHub may delay a few
    # minutes under load, which is fine — send-reminders.js checks a
    # 30-minute window anyway, so this still catches every reminder time.
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  trigger-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call send-reminders endpoint
        run: |
          curl -sS -f -X GET "https://www.buildbitachon.org/api/send-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
